<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Access denied</title>
</head>
<body>
<div layout:fragment="content">
    <div class="text-center py-5">
        <i class="bi bi-shield-lock text-danger" style="font-size:3rem;"></i>
        <h3 class="mt-3">Access denied</h3>
        <p class="text-muted" th:text="${message} ?: 'You do not have permission to view this resource.'">message</p>
        <a th:href="@{/dashboard}" class="btn btn-primary">Back to dashboard</a>
    </div>
</div>
</body>
</html>
