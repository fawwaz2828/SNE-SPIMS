<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title>Log Incident</title></head>
<body>
<div layout:fragment="content">

    <h3 class="mb-3"><i class="bi bi-exclamation-triangle me-1"></i> Log Behavior Incident</h3>

    <form method="post" th:action="@{/incidents}" class="row g-3 bg-white p-4 border rounded">
        <div class="col-md-6">
            <label class="form-label">Student <span class="text-danger">*</span></label>
            <select name="studentId" class="form-select" required>
                <option value="">Select…</option>
                <option th:each="s : ${roster}" th:value="${s.id}" th:text="${s.fullName}"
                        th:selected="${s.id == selectedStudentId}"></option>
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label">Date &amp; time <span class="text-danger">*</span></label>
            <input type="datetime-local" name="incidentDate" class="form-control" required/>
        </div>
        <div class="col-md-3">
            <label class="form-label">Severity <span class="text-danger">*</span></label>
            <select name="severity" class="form-select" required>
                <option th:each="sv : ${severities}" th:value="${sv}" th:text="${sv}"></option>
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label">Location</label>
            <input name="location" class="form-control"/>
        </div>
        <div class="col-12">
            <label class="form-label">Description <span class="text-danger">*</span></label>
            <textarea name="description" class="form-control" rows="3" required></textarea>
        </div>
        <div class="col-12">
            <label class="form-label">Action taken</label>
            <textarea name="actionTaken" class="form-control" rows="2"></textarea>
        </div>
        <div class="col-12">
            <div class="form-check">
                <input type="checkbox" name="parentVisible" value="true" class="form-check-input" id="pv"/>
                <label class="form-check-label" for="pv">Visible to parents
                    <span class="text-muted small">(HIGH/CRITICAL are always shared)</span></label>
            </div>
        </div>
        <div class="col-12">
            <button class="btn btn-primary" type="submit">Log incident</button>
            <a th:href="@{/incidents}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
