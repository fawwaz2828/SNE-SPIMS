<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title>Users</title></head>
<body>
<div layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0"><i class="bi bi-person-gear me-1"></i> User Accounts</h3>
        <a th:href="@{/users/new}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i> New Account</a>
    </div>

    <form method="get" th:action="@{/users}" class="row g-2 mb-3">
        <div class="col-md-3">
            <select name="role" class="form-select form-select-sm" onchange="this.form.submit()">
                <option value="">All roles</option>
                <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"
                        th:selected="${r == roleFilter}"></option>
            </select>
        </div>
    </form>

    <table class="table table-hover align-middle bg-white">
        <thead class="table-light">
        <tr><th>Username</th><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Status</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(users)}"><td colspan="7" class="text-center text-muted py-4">No accounts.</td></tr>
        <tr th:each="u : ${users}">
            <td th:text="${u.username}">user</td>
            <td th:text="${u.fullName}">Name</td>
            <td th:text="${u.email}">email</td>
            <td th:text="${u.phone}">phone</td>
            <td><span class="badge bg-info text-dark" th:text="${u.role}">ROLE</span></td>
            <td>
                <span th:if="${u.active}" class="badge bg-success">Active</span>
                <span th:unless="${u.active}" class="badge bg-secondary">Inactive</span>
            </td>
            <td class="text-end text-nowrap">
                <a th:href="@{/users/{id}/edit(id=${u.id})}" class="btn btn-sm btn-outline-primary">
                    <i class="bi bi-pencil"></i></a>
                <button class="btn btn-sm btn-outline-secondary" data-bs-toggle="modal"
                        th:data-bs-target="'#pw-' + ${u.id}"><i class="bi bi-key"></i></button>
                <form method="post" th:action="@{/users/{id}/active(id=${u.id})}" class="d-inline">
                    <input type="hidden" name="active" th:value="${!u.active}"/>
                    <button class="btn btn-sm" th:classappend="${u.active} ? 'btn-outline-danger' : 'btn-outline-success'">
                        <i class="bi" th:classappend="${u.active} ? 'bi-pause' : 'bi-play'"></i></button>
                </form>

                <!-- Reset password modal -->
                <div class="modal fade" th:id="'pw-' + ${u.id}" tabindex="-1">
                    <div class="modal-dialog"><div class="modal-content">
                        <form method="post" th:action="@{/users/{id}/password(id=${u.id})}">
                            <div class="modal-header"><h5 class="modal-title">Reset password</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                            <div class="modal-body text-start">
                                <label class="form-label">New password for <strong th:text="${u.username}">user</strong></label>
                                <input type="password" name="password" class="form-control" minlength="6" required/>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                <button class="btn btn-primary" type="submit">Reset</button>
                            </div>
                        </form>
                    </div></div>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
