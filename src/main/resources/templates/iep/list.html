<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title>IEP Programs</title></head>
<body>
<div layout:fragment="content">

    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/students}" th:text="${currentUser != null and currentUser.parent} ? 'My Children' : 'Students'">Students</a></li>
            <li class="breadcrumb-item"><a th:href="@{/students/{id}(id=${student.id})}" th:text="${student.fullName}">Name</a></li>
            <li class="breadcrumb-item active">IEP</li>
        </ol>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0"><i class="bi bi-clipboard2-pulse me-1"></i> IEP Programs</h3>
        <a th:if="${canEdit}" th:href="@{/students/{id}/iep/new(id=${student.id})}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i> New IEP</a>
    </div>

    <div class="list-group">
        <div th:if="${#lists.isEmpty(programs)}" class="text-muted text-center py-4">No IEP programs yet.</div>
        <a th:each="p : ${programs}" th:href="@{/iep/{id}(id=${p.id})}"
           class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
            <span>
                <strong th:text="${p.title}">Title</strong>
                <span class="text-muted ms-2" th:text="${p.academicYear}">2024/25</span>
                <span class="small text-muted ms-2" th:text="|${p.startDate} – ${p.endDate}|">dates</span>
            </span>
            <span class="badge"
                  th:classappend="${p.status == 'ACTIVE'} ? 'bg-success' : (${p.status == 'DRAFT'} ? 'bg-warning text-dark' : 'bg-secondary')"
                  th:text="${p.status}">STATUS</span>
        </a>
    </div>
</div>
</body>
</html>
