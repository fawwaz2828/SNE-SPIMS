<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="'Sign in · ' + ${schoolName}">Sign in · Luna Bridge</title>
    <link rel="icon" type="image/png" th:href="@{/images/lunabridge.png}"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <style>
        /* Login is standalone (no Bootstrap reset) — make every element use the
           border-box model so inputs (with padding+border) and the button line
           up to exactly the same width. */
        .lb-shell *, .lb-shell *::before, .lb-shell *::after { box-sizing: border-box; }

        body { background: var(--bg); height: 100vh; overflow: hidden; margin: 0;
               display: grid; place-items: center; padding: 28px; }

        .lb-shell {
            width: 100%; max-width: 1120px;
            height: min(640px, calc(100vh - 56px));
            display: grid; grid-template-columns: 1.05fr 1fr; gap: 0;
            align-items: stretch;
        }

        /* ---------- Left brand panel ---------- */
        .lb-brand-panel {
            position: relative; overflow: hidden; border-radius: 26px;
            padding: 34px 40px;
            display: flex; flex-direction: column; justify-content: space-between;
            color: #fff;
            background:
                linear-gradient(180deg, oklch(0 0 0 / .30) 0%, oklch(0 0 0 / .68) 100%),
                url('/images/loginimage.jpg') center / cover no-repeat;
        }
        .lb-brand { display: flex; align-items: center; }
        .lb-brand .lb-logo { height: 48px; width: auto; object-fit: contain; }

        .lb-copy { max-width: 440px; text-shadow: 0 1px 4px oklch(0 0 0 / .55); }
        .lb-eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .16em;
            text-transform: uppercase; color: oklch(1 0 0 / .9); margin-bottom: 16px; }
        .lb-copy h1 { font-size: 44px; line-height: 1.06; font-weight: 800;
            letter-spacing: -.02em; margin: 0 0 18px; color: #fff; }
        .lb-copy p { font-size: 15.5px; line-height: 1.55; color: oklch(1 0 0 / .95); margin: 0; }
        .lb-assure { display: flex; align-items: center; gap: 11px; margin-top: 26px;
            font-size: 13.5px; font-weight: 600; color: #fff; }
        .lb-assure .ic { width: 34px; height: 34px; border-radius: 10px; flex: none;
            display: grid; place-items: center; background: oklch(1 0 0 / .22); font-size: 1rem; }

        /* ---------- Right form panel ---------- */
        .lb-form-panel { display: flex; align-items: center; justify-content: center; padding: 24px 18px; }
        .lb-form { width: 100%; max-width: 380px; }
        .lb-form h2 { font-size: 30px; font-weight: 800; letter-spacing: -.02em;
            color: var(--ink); margin: 0 0 6px; }
        .lb-form .sub { color: var(--ink-soft); font-size: 15px; margin: 0 0 26px; }

        .lb-label { font-size: 13.5px; font-weight: 700; color: var(--ink); margin: 0 0 7px; }
        .lb-row { display: flex; justify-content: space-between; align-items: baseline; }
        .lb-field { position: relative; margin-bottom: 18px; }
        .lb-field .lead-ic { position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
            color: var(--ink-soft); font-size: 1rem; pointer-events: none; }
        .lb-input {
            width: 100%; height: 52px; padding: 0 16px 0 44px;
            border: 1px solid var(--border); border-radius: 14px;
            background: var(--surface); color: var(--ink); font: inherit; font-size: 15px;
            transition: border-color .15s, box-shadow .15s;
        }
        .lb-input::placeholder { color: oklch(0.7 0.02 50); }
        .lb-input:focus { outline: none; border-color: var(--red);
            box-shadow: 0 0 0 4px oklch(0.59 0.155 28 / .14); }
        .lb-show { position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
            background: none; border: 0; color: var(--red-deep); font: inherit; font-size: 13px;
            font-weight: 700; cursor: pointer; padding: 4px; }

        .lb-options { display: flex; justify-content: space-between; align-items: center;
            margin: 4px 0 22px; }
        .lb-check { display: flex; align-items: center; gap: 9px; font-size: 13.5px;
            color: var(--ink-soft); font-weight: 600; cursor: pointer; user-select: none; }
        .lb-check input { width: 18px; height: 18px; accent-color: var(--red); cursor: pointer; }
        .lb-link { color: var(--red-deep); font-weight: 700; font-size: 13.5px; text-decoration: none; }
        .lb-link:hover { text-decoration: underline; }

        .lb-submit {
            width: 100%; height: 54px; border: 0; border-radius: 14px; cursor: pointer;
            background: var(--red); color: #fff; font: inherit; font-size: 15.5px; font-weight: 700;
            display: inline-flex; align-items: center; justify-content: center; gap: 9px;
            box-shadow: 0 12px 24px -10px oklch(0.59 0.155 28 / .7);
            transition: filter .15s, transform .05s;
        }
        .lb-submit:hover { filter: brightness(1.04); }
        .lb-submit:active { transform: translateY(1px); }

        .lb-fine { color: var(--ink-soft); font-size: 12px; line-height: 1.5; margin: 20px 0 0; }

        .lb-alert { border-radius: 12px; padding: 11px 14px; font-size: 13.5px; font-weight: 600;
            margin-bottom: 18px; }
        .lb-alert.err { background: var(--red-tint); color: var(--red-deep); }
        .lb-alert.ok  { background: oklch(0.95 0.05 150); color: oklch(0.4 0.1 150); }

        /* ---------- Responsive: hide brand panel, center the form ---------- */
        @media (max-width: 860px) {
            body { height: auto; min-height: 100vh; overflow: auto; }
            .lb-shell { grid-template-columns: 1fr; height: auto; min-height: 0; max-width: 420px; }
            .lb-brand-panel { display: none; }
        }
    </style>
</head>
<body>
<div class="lb-shell">

    <!-- Left: brand / marketing -->
    <aside class="lb-brand-panel">
        <div class="lb-brand">
            <img class="lb-logo" th:src="@{/images/lunabridgewhite.png}" alt="Luna Bridge"/>
        </div>

        <div class="lb-copy">
            <h1>Every child's progress, in one calm place.</h1>
            <p>Track progress across all five development areas, follow upcoming
               sessions, and stay close to your child's team — together.</p>
        </div>
    </aside>

    <!-- Right: sign-in form -->
    <main class="lb-form-panel">
        <div class="lb-form">
            <h2>Welcome back</h2>
            <p class="sub">Sign in to continue to your dashboard.</p>

            <div th:if="${param.error}" class="lb-alert err">Invalid username or password.</div>
            <div th:if="${param.logout}" class="lb-alert ok">You have been signed out.</div>

            <form th:action="@{/login}" method="post">
                <p class="lb-label">Username</p>
                <div class="lb-field">
                    <i class="bi bi-person lead-ic"></i>
                    <input class="lb-input" type="text" name="username" id="username"
                           placeholder="e.g. laura" autofocus required/>
                </div>

                <p class="lb-label">Password</p>
                <div class="lb-field">
                    <i class="bi bi-lock lead-ic"></i>
                    <input class="lb-input" type="password" name="password" id="password"
                           placeholder="Enter your password" required/>
                    <button type="button" class="lb-show" id="togglePw">Show</button>
                </div>

                <div class="lb-options">
                    <label class="lb-check">
                        <input type="checkbox" name="remember-me" checked/> Keep me signed in
                    </label>
                </div>

                <button type="submit" class="lb-submit">
                    <i class="bi bi-box-arrow-in-right"></i> Sign in
                </button>
            </form>

        </div>
    </main>
</div>

<script>
    (function () {
        const btn = document.getElementById('togglePw');
        const pw = document.getElementById('password');
        btn.addEventListener('click', function () {
            const show = pw.type === 'password';
            pw.type = show ? 'text' : 'password';
            btn.textContent = show ? 'Hide' : 'Show';
        });
    })();
</script>
</body>
</html>
