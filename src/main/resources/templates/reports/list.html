<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title>Daily Reports</title></head>
<body>
<div layout:fragment="content">

    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/students}" th:text="${currentUser != null and currentUser.parent} ? 'My Children' : 'Students'">Students</a></li>
            <li class="breadcrumb-item"><a th:href="@{/students/{id}(id=${student.id})}" th:text="${student.fullName}">Name</a></li>
            <li class="breadcrumb-item active">Daily Reports</li>
        </ol>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0"><i class="bi bi-journal-text me-1"></i> Daily Reports</h3>
        <a th:if="${canEdit}" th:href="@{/students/{id}/reports/new(id=${student.id})}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i> New Report</a>
    </div>

    <table class="table table-hover align-middle bg-white">
        <thead class="table-light"><tr><th>Date</th><th>Mood</th><th>Status</th><th>Teacher</th></tr></thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(reports)}"><td colspan="4" class="text-center text-muted py-4">No reports.</td></tr>
        <tr th:each="r : ${reports}" style="cursor:pointer"
            th:onclick="|window.location='@{/reports/{id}(id=${r.id})}'|">
            <td th:text="${r.reportDate}">date</td>
            <td th:text="${r.mood}">mood</td>
            <td>
                <span th:if="${r.published}" class="badge bg-success">Published</span>
                <span th:unless="${r.published}" class="badge bg-warning text-dark">Draft</span>
            </td>
            <td th:text="${r.teacherName}">teacher</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
