<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Chat</title>
    <th:block layout:fragment="pageStyles">
    <style>
        .ch { display:grid; grid-template-columns:320px 1fr; gap:20px; align-items:start; }
        @media (max-width: 820px) { .ch { grid-template-columns:1fr; } .ch .roomspane { display:none; } }

        /* Left rooms pane */
        .ch .roomspane { border:1px solid var(--border); border-radius:18px; background:var(--surface); overflow:hidden; }
        .ch .roomspane .r { display:flex; gap:10px; align-items:center; padding:12px 14px; text-decoration:none; color:inherit; }
        .ch .roomspane .r + .r { border-top:1px solid var(--border); }
        .ch .roomspane .r:hover { background:var(--bg); }
        .ch .roomspane .r.active { background:var(--red-tint); }
        .ch .av { width:38px; height:38px; border-radius:50%; flex:none; display:grid; place-items:center;
            font-weight:800; font-size:14px; color:var(--red-deep); background:var(--red-tint); }
        .ch .roomspane .r.active .av { background:#fff; }
        .ch .roomspane .nm { font-weight:700; font-size:14px; }
        .ch .roomspane .sb { font-size:12px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

        /* Right chat panel */
        .ch .chat { border:1px solid var(--border); border-radius:18px; background:var(--surface);
            display:flex; flex-direction:column; height:calc(100vh - 150px); min-height:420px; overflow:hidden; }
        .ch .chead { display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--border); }
        .ch .chead .nm { font-weight:800; font-size:16px; }
        .ch .chead .sub { font-size:12.5px; color:var(--ink-soft); }
        .ch .body { flex:1 1 auto; overflow-y:auto; padding:20px 18px; display:flex; flex-direction:column; gap:10px; }
        /* Anchor messages to the bottom (near the composer). margin-top:auto on the
           first item pushes the stack down; it collapses to 0 once content overflows,
           so scrolling still works without clipping the top. */
        .ch .body > :first-child { margin-top:auto; }
        .ch .b { max-width:min(64%, 520px); width:fit-content; padding:9px 13px; border-radius:16px; font-size:14px; line-height:1.45; word-wrap:break-word; }
        /* pre-wrap only on the message text so the user's own line breaks survive
           WITHOUT leaking the template's source indentation into the bubble. */
        .ch .b .msg { white-space:pre-wrap; }
        .ch .b .t { display:block; font-size:10.5px; margin-top:4px; opacity:.7; }
        .ch .them { align-self:flex-start; background:var(--bg); border:1px solid var(--border); border-bottom-left-radius:5px; }
        .ch .mine { align-self:flex-end; background:var(--red); color:#fff; border-bottom-right-radius:5px; }
        .ch .day { align-self:center; font-size:11.5px; color:var(--ink-soft); margin:6px 0; }
        .ch .composer { display:flex; gap:10px; padding:12px 14px; border-top:1px solid var(--border); }
        .ch .composer textarea { flex:1 1 auto; resize:none; border:1px solid var(--border); border-radius:14px;
            padding:10px 14px; font:inherit; font-size:14px; background:var(--bg); color:var(--ink); max-height:120px; }
        .ch .composer button { flex:none; border:none; border-radius:50%; width:44px; height:44px;
            background:var(--red); color:#fff; font-size:1.1rem; cursor:pointer; }
        .ch .back { display:none; }
        @media (max-width: 820px) { .ch .back { display:inline; } }
        .ch .empty { margin:auto; text-align:center; color:var(--ink-soft); }
    </style>
    </th:block>
</head>
<body>
<div layout:fragment="content">
  <div class="ch">

    <!-- Left: rooms -->
    <div class="roomspane">
        <a th:each="c : ${conversations}" class="r"
           th:classappend="${c.otherId == otherId and (c.studentId == null or c.studentId == studentId)} ? 'active'"
           th:href="${c.studentId != null} ? @{'/messages/with/' + ${c.otherId}(studentId=${c.studentId})} : @{'/messages/with/' + ${c.otherId}}">
            <span class="av" th:text="${#strings.substring(c.otherName,0,1)}">A</span>
            <div style="min-width:0;flex:1 1 auto;">
                <div class="nm" th:text="${c.otherName}">Name</div>
                <div class="sb" th:text="${c.studentName != null ? '· ' + c.studentName : ''}">· Student</div>
            </div>
            <span class="badge bg-danger rounded-pill" th:if="${c.unread > 0}" th:text="${c.unread}">1</span>
        </a>
    </div>

    <!-- Right: chat -->
    <div class="chat">
        <div class="chead">
            <a class="back btn btn-sm btn-light" th:href="@{/messages}"><i class="bi bi-arrow-left"></i></a>
            <span class="av" th:text="${otherName != null} ? ${#strings.substring(otherName,0,1)} : '?'">A</span>
            <div>
                <div class="nm" th:text="${otherName} ?: 'Conversation'">Name</div>
            </div>
        </div>

        <div class="body" id="chatBody">
            <div class="empty" th:if="${#lists.isEmpty(thread)}">
                <i class="bi bi-chat-dots" style="font-size:28px;"></i>
                <p class="mt-2 mb-0">No messages yet — say hello 👋</p>
            </div>
            <div th:each="m : ${thread}" th:class="${m.senderId == me} ? 'b mine' : 'b them'">
                <span class="msg" th:text="${m.body}">message</span>
                <span class="t" th:text="${#temporals.format(m.sentAt, 'dd MMM · HH:mm')}">12 Jun · 09:00</span>
            </div>
        </div>

        <form class="composer" method="post" th:action="@{/messages/send}" th:if="${studentId != null and canReply}">
            <input type="hidden" name="otherId" th:value="${otherId}"/>
            <input type="hidden" name="studentId" th:value="${studentId}"/>
            <textarea name="body" rows="1" placeholder="Write a message…" required
                      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();this.form.submit();}"></textarea>
            <button type="submit" title="Send"><i class="bi bi-send"></i></button>
        </form>
        <div th:unless="${studentId != null and canReply}"
             style="padding:14px 18px;border-top:1px solid var(--border);font-size:13px;color:var(--ink-soft);text-align:center;">
            <i class="bi bi-info-circle me-1"></i>
            You can no longer message this contact about this student.
        </div>
    </div>
  </div>

  <script>
    (function () {
      var b = document.getElementById('chatBody');
      if (b) { b.scrollTop = b.scrollHeight; }
    })();
  </script>
</div>
</body>
</html>
